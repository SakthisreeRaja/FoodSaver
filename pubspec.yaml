name: foodsaver
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # --- FoodSaver Custom Dependencies ---
  google_fonts: ^6.2.1
  camera: ^0.11.0+1
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  http: ^1.2.1
  provider: ^6.1.2
  firebase_core: ">=4.7.0 <4.8.0"
  cloud_firestore: ">=6.3.0 <6.4.0"
  firebase_auth: ">=6.4.0 <6.5.0"
  cloud_functions: ">=6.2.0 <6.3.0"
  firebase_messaging: ">=16.2.0 <16.2.1"
  flutter_dotenv: ^5.2.0
  go_router: ^14.2.0
  
  # --- Maps & Location ---
  flutter_map: ^6.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  location: ^6.0.0
  google_maps_flutter: ^2.8.0
  
  # --- State Management ---
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # --- Utils ---
  intl: ^0.19.0
  uuid: ^4.0.0
  cached_network_image: ^3.3.0
  firebase_app_check: ^0.4.3
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
